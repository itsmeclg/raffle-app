<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        h2 { margin-bottom: 20px; }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        .delete-btn {
            background-color: #d9534f;
        }
        .delete-btn:hover {
            background-color: #c9302c;
        }
        .export-btn {
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 8px;
            width: 300px;
        }
    </style>
</head>
<body>
    <h2>Raffle Entries Dashboard</h2>

<!-- CSV Export Button -->
<div class="export-btn">
    <a href="/export" style="text-decoration:none;">
        <button>Download CSV</button>
    </a>
</div>


<style>
.summary-box {
    background-color: #f9f9f9;
    border: 1px solid #ccc;
    padding: 15px;
    border-radius: 6px;
    width: 300px;
    margin-bottom: 20px;
}
.summary-box p {
    margin: 5px 0;
}
</style>

<div class="summary-box">
    <h3>Summary</h3>
    <p><strong>Total Entries:</strong> {{ total_entries }}</p>
    <p><strong>Remaining QR Codes:</strong> {{ remaining_qr }}</p>
</div>

    <!-- Search Bar -->
    <form method="POST" style="margin-bottom:20px;">
        <input type="text" name="search" placeholder="Search by name, phone, or QR number"
               value="{{ search_query }}">
        <button type="submit">Search</button>
        <a href="/admin" style="margin-left:10px; font-size:14px;">Clear</a>
    </form>

    <!-- Entries Table -->
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>QR Number</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
        {% for row in rows %}
        <tr id="row-{{ row[0] }}">
            <td>{{ row[0] }}</td>
            <td contenteditable="true" class="editable-name">{{ row[1] }}</td>
            <td contenteditable="true" class="editable-phone">{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>
                <button onclick="saveEdit({{ row[0] }})">Save</button>
                <button class="delete-btn" onclick="deleteEntry({{ row[0] }})">Delete</button>
            </td>
        </tr>
        {% endfor %}
    </table>

    <!-- JavaScript for Edit/Delete -->
    <script>
    function deleteEntry(id) {
        if (confirm("Are you sure you want to delete this entry?")) {
            fetch(`/delete/${id}`, { method: "POST" })
                .then(response => {
                    if (response.ok) {
                        document.getElementById(`row-${id}`).remove();
                        alert("Entry deleted successfully!");
                    } else {
                        alert("Error deleting entry. Please try again.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("An unexpected error occurred.");
                });
        }
    }

    function saveEdit(id) {
        const row = document.getElementById(`row-${id}`);
        const name = row.querySelector(".editable-name").innerText.trim();
        const phone = row.querySelector(".editable-phone").innerText.trim();

        fetch(`/edit/${id}`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`
        })
        .then(response => {
            if (response.ok) {
                alert("Changes saved successfully!");
            } else {
                alert("Error saving changes. Please try again.");
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An unexpected error occurred.");
        });
    }
    </script>
</body>
</html>
